<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Só aceita arquivos deste próprio site: nada de CDN, fonte externa ou envio de dados para fora. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1E3A5F">
<meta name="description" content="Painel financeiro pessoal. Os dados ficam só no aparelho.">
<title>Dash financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="wrap" id="app">
  <header>
    <div>
      <div class="olho" id="olho"></div>
      <h1 id="titulo"></h1>
    </div>
  </header>
  <nav class="abas" id="abas" aria-label="Telas"></nav>
  <main id="conteudo"></main>
  <footer id="status" class="mini"></footer>
</div>

<div id="aviso" class="toast" role="status" aria-live="polite"></div>

<dialog id="modal">
  <form method="dialog" id="modal-form">
    <div class="rot" id="modal-rot"></div>
    <div class="modal-t" id="modal-t"></div>
    <div class="mini" id="modal-txt"></div>
    <div id="modal-campos"></div>
    <div class="linha-b modal-botoes" id="modal-botoes"></div>
  </form>
</dialog>

<input type="file" id="arquivo" accept=".json,application/json" hidden>

<script src="js/dados.js"></script>
<script src="js/calculos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
